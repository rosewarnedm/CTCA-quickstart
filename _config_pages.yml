# Overlay for GitHub Pages build — applied on top of _config.yml by the CI workflow.
# Local preview uses _config.yml only (minima theme).
url: "https://rosewarnedm.github.io"
baseurl: "/CTCA-quickstart"
theme: just-the-docs

color_scheme: light

search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10

nav_sort: case_insensitive
heading_anchors: true

footer_content: >-
  CTCA Quick-Start Guide &mdash; AI-generated content requires expert review before clinical use.
  Values marked &lt;&lt;like this&gt;&gt; must be independently verified.

defaults:
  - scope:
      path: ""
    values:
      layout: "default"

callouts_level: quiet
callouts:
  note:
    title: Note
    color: purple
  important:
    title: Important
    color: blue
  warning:
    title: Warning
    color: red
  tip:
    title: Tip
    color: green
